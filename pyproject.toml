[project]
name = "edhiphy"
version = "2.0.0"
description = "Build pipeline for the edhiphy database of philosopher mentions in JSTOR journals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gregor Bös", email = "mail@gregorboes.com" }]
dependencies = [
    "dask[dataframe]>=2025.1",
    "openpyxl>=3.1",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scipy>=1.13",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edhiphy"]

[tool.uv]
# The project itself is used from the source tree (PYTHONPATH=src), so that
# the Docker image needs no rebuild after code changes.
package = false

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
